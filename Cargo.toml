[package]
name = "fitness-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1.47.1", features = ["full"]}
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "macros", "migrate", "chrono"] }
uuid = {version = "1.17.0", features = ["v4", "serde"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0.219", features = ["derive"] }
dotenv = "0.15.0"
serde_json = "1.0.142"
tracing-subscriber = "0.3.19"
chrono = "0.4.41"
argon2 = "0.5.3"
axum = "0.8.4"
thiserror = "2.0.16"
jsonwebtoken = "9.2.0"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
